name: Lint Presentations
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Lint Presentations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install

      - name: Lint markdown files
        run: pnpm exec markdownlint .
